input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Record ingestion timestamp
  mutate {
    add_field => { "[@metadata][received_at]" => "%{@timestamp}" }
  }

  # Default fallback if service is missing
  if ![service] {
    mutate {
      add_field => { "service" => "unknown-service" }
    }
  }

  # HIPAA PHI Redaction: Mask social security numbers, passwords, auth tokens
  mutate {
    gsub => [
      "message", "\b\d{3}-\d{2}-\d{4}\b", "XXX-XX-XXXX",
      "message", "(?i)(password|passwd|secret|token|bearer)=\S+", "\1=***REDACTED***"
    ]
  }

  # Tag exceptions for easy dashboard filtering
  if [stack_trace] or [exception] {
    mutate {
      add_tag => [ "has_exception" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "medtrust-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug { metadata => false }
  }
}
