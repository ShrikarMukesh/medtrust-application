replicaCount: 2
image:
  repository: ctshrikar/integration-service
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: NodePort
  port: 8087
  targetPort: 8087
  nodePort: 30008
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
env:
  DB_HOST: medtrust-postgres
  DB_PORT: "5432"
  DB_DATABASE: medtrust
  DB_USERNAME: medtrust
  KAFKA_BROKER: medtrust-kafka:9092
secrets:
  DB_PASSWORD: changeme
livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8087
  initialDelaySeconds: 90
  periodSeconds: 15
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8087
  initialDelaySeconds: 45
  periodSeconds: 10
  failureThreshold: 3
nodeSelector:
  workload: services
podAntiAffinity: true
