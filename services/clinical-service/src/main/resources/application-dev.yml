# ── Clinical Service – Dev Profile ──────────────────────────────────────

spring:
    jpa:
        show-sql: true
        properties:
            hibernate:
                format_sql: true

management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            show-details: always

logging:
    level:
        root: INFO
        com.medtrust.clinical: DEBUG
        org.hibernate.SQL: DEBUG
        org.hibernate.orm.jdbc.bind: TRACE
