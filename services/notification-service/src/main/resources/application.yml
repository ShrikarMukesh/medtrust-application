server:
    port: 8086

spring:
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}
    application:
        name: notification-service

    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:medtrust}
        username: ${DB_USERNAME:medtrust}
        password: ${DB_PASSWORD:changeme}
        driver-class-name: org.postgresql.Driver
        hikari:
            schema: notification

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        open-in-view: false
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect
                default_schema: notification

    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true
        schemas: notification
        default-schema: notification

    kafka:
        bootstrap-servers: ${KAFKA_BROKER:localhost:29093}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
        consumer:
            group-id: ${KAFKA_GROUP_ID:notification-service-group}
            auto-offset-reset: earliest
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    # Email (SMTP) — defaults to no-op; configure for real delivery
    mail:
        host: ${SMTP_HOST:localhost}
        port: ${SMTP_PORT:1025}
        username: ${SMTP_USERNAME:}
        password: ${SMTP_PASSWORD:}
        properties:
            mail:
                smtp:
                    auth: false
                    starttls:
                        enable: false

# ─── Channel Configuration ─────────────────────────────────────────

app:
    whatsapp:
        enabled: ${WHATSAPP_ENABLED:false}
        phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
        access-token: ${WHATSAPP_ACCESS_TOKEN:}

    sms:
        enabled: ${SMS_ENABLED:false}
        twilio:
            account-sid: ${TWILIO_ACCOUNT_SID:${twilio.account.sid:}}
            auth-token: ${TWILIO_AUTH_TOKEN:${twilio.auth.token:}}
            from-number: ${TWILIO_FROM_NUMBER:${twilio.from.number:}}

    email:
        enabled: ${EMAIL_ENABLED:false}
        from: ${EMAIL_FROM:noreply@medtrust.com}

# ─── Resilience4j ───────────────────────────────────────────────────

resilience4j:
    circuitbreaker:
        configs:
            default:
                registerHealthIndicator: true
                slidingWindowType: COUNT_BASED
                slidingWindowSize: 10
                minimumNumberOfCalls: 5
                failureRateThreshold: 50
                waitDurationInOpenState: 30s
                permittedNumberOfCallsInHalfOpenState: 3
                automaticTransitionFromOpenToHalfOpenEnabled: true
                ignoreExceptions:
                    - com.medtrust.notification.infrastructure.channel.TwilioClientException
        instances:
            whatsappSender:
                baseConfig: default
            smsSender:
                baseConfig: default
            emailSender:
                baseConfig: default

    retry:
        configs:
            default:
                maxAttempts: 3
                waitDuration: 1s
                enableExponentialBackoff: true
                exponentialBackoffMultiplier: 2
                ignoreExceptions:
                    - com.medtrust.notification.infrastructure.channel.TwilioClientException
        instances:
            whatsappSender:
                baseConfig: default
            smsSender:
                baseConfig: default
            emailSender:
                baseConfig: default

# ─── Actuator ──────────────────────────────────────────────────────

management:
    endpoints:
        web:
            exposure:
                include: health,info,circuitbreakers,retries,metrics
    endpoint:
        health:
            show-details: always
    health:
        circuitbreakers:
            enabled: true

logging:
    level:
        com.medtrust.notification: DEBUG
