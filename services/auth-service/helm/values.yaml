# ── Auth Service Helm Values ──

replicaCount: 2

image:
  repository: ctshrikar/auth-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8083
  targetPort: 8083
  nodePort: 30004

# ── Resource Limits ──
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

# ── Environment Variables ──
env:
  DB_HOST: medtrust-postgres
  DB_PORT: "5432"
  DB_DATABASE: medtrust
  DB_USERNAME: medtrust
  KAFKA_BROKER: medtrust-kafka:9092

# ── Secrets (base64 encoded in secret.yaml) ──
secrets:
  DB_PASSWORD: changeme
  JWT_SECRET: medtrust-super-secret-key-that-is-at-least-256-bits-long-for-hs256-signing

# ── Health Checks ──
livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8083
  initialDelaySeconds: 120
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 10

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8083
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# ── Node Affinity ──
nodeSelector:
  workload: services

# ── Pod Anti-Affinity ──
podAntiAffinity: true
