# ── Auth Service – Dev Profile ──────────────────────────────────────────

spring:
    jpa:
        show-sql: true
        properties:
            hibernate:
                format_sql: true

app:
    jwt:
        secret: ${JWT_SECRET:dev-medtrust-jwt-secret-key-that-is-at-least-256-bits-long-for-hs256}
        access-token-expiry-ms: 900000          # 15 minutes
        refresh-token-expiry-days: 7

management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            show-details: always

logging:
    level:
        root: INFO
        com.medtrust.auth: DEBUG
        org.hibernate.SQL: DEBUG
        org.hibernate.orm.jdbc.bind: TRACE
