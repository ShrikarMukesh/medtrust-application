# ── Appointment Service – QA Profile ────────────────────────────────────

spring:
    jpa:
        show-sql: false
        properties:
            hibernate:
                format_sql: false

management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,circuitbreakers,retries,bulkheads
    endpoint:
        health:
            show-details: always

logging:
    level:
        root: INFO
        com.medtrust.appointment: INFO
        org.hibernate.SQL: WARN
